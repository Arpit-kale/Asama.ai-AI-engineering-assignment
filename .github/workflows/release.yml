# Push a tag like v1.1.0 to publish:
#   ghcr.io/<owner>/agent-network:<version> and :latest
#   GitHub Release with hwqa wheel, hwqa.pyz, install.sh and checksums
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-network
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: agent_network
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  hwqa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -q
      - run: ./scripts/build.sh && cp install.sh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: hw_assistant/dist/*
          generate_release_notes: true
