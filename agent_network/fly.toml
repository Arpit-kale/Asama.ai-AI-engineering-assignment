# fly launch --no-deploy --copy-config && fly volumes create data --size 1
# fly secrets set AN_ADMIN_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(32))")
# fly deploy
app = "agent-network"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  AN_ENV = "production"
  AN_DB_PATH = "/data/agent_network.db"
  PORT = "8000"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # background routing/delivery workers must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    timeout = "5s"
