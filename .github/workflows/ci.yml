name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-network-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_network/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  agent-network-docker:
    needs: agent-network-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agent-network:ci agent_network
      - name: Smoke test the container
        run: |
          docker run -d --name an -p 8000:8000 \
            -e AN_ADMIN_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" agent-network:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs localhost:8000/ready
          test "$(docker exec an id -un)" = appuser
      - name: Container logs
        if: failure()
        run: docker logs an

  hw-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: hw_assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Build wheel + single-file zipapp
        run: ./scripts/build.sh
      - name: Smoke test artifacts
        run: |
          ./dist/hwqa.pyz --version
          ./dist/hwqa.pyz --check
          ./dist/hwqa.pyz -q "How much RAM do I have?"
          pip install dist/*.whl && hwqa -q "how many cores does my cpu have"
